<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram - Display</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page-display page-screen--live">
  <main class="container">
    <section class="panel">
      <h1 class="card-title">Instagram Display</h1>
      <p class="card-text">A imagem do Instagram foi gerada a partir dos dados enviados.</p>
      <div id="warning" class="warning" style="display:none;"></div>
      <div class="result-container">
        <canvas id="leaderboardCanvas" width="1080" height="1920"></canvas>
        <div class="btn-group" style="width: 100%;">
            <button class="btn btn-primary" onclick="baixarImagem()">Baixar Imagem</button>
        </div>
      </div>
    </section>
  </main>

  <script src="herois.js"></script>
  <script>
    const warning = document.getElementById('warning');
    const canvas = document.getElementById('leaderboardCanvas');
    const ctx = canvas.getContext('2d');

    function showWarning(message) {
      warning.textContent = message;
      warning.style.display = 'block';
    }

    function normalizeText(txt) {
      return txt ? txt.toString().trim().toLowerCase() : '';
    }

    function formatarData(dataString) {
      if (!dataString) return "";
      const [ano, mes, dia] = dataString.split('-');
      return `${dia}/${mes}/${ano}`;
    }

    function carregarImagem(src) {
      return new Promise((resolve) => {
        const img = new Image();
        img.src = src;
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
      });
    }

    function drawImageCover(ctx, img, x, y, w, h) {
      const imgRatio = img.width / img.height;
      const canvasRatio = w / h;
      let sx, sy, sw, sh;

      if (imgRatio > canvasRatio) {
        sh = img.height;
        sw = sh * canvasRatio;
        sx = (img.width - sw) / 2;
        sy = img.height * 0.05;
      } else {
        sw = img.width;
        sh = sw / canvasRatio;
        sx = 0;
        sy = img.height * 0.05;
      }

      ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
    }

    function obterCaminhoImagemDoJson(nomeHeroiOriginal) {
      if (!nomeHeroiOriginal) return "assets/heroes/default.jpg";
      const heroiLimpo = nomeHeroiOriginal.replace(/\s*\(ll\)\s*$/i, '').trim().toLowerCase();
      const exact = bancoDeImagensHerois.find(h => h.nome.toLowerCase() === heroiLimpo);
      if (exact && exact.arquivo) {
        return exact.arquivo.startsWith('assets/') ? exact.arquivo : `assets/${exact.arquivo}`;
      }

      const partial = bancoDeImagensHerois.find(h => {
        const nomeBanco = h.nome.toLowerCase();
        return (nomeBanco.includes(heroiLimpo) || heroiLimpo.includes(nomeBanco));
      });

      if (partial && partial.arquivo) {
        return partial.arquivo.startsWith('assets/') ? partial.arquivo : `assets/${partial.arquivo}`;
      }

      return "assets/heroes/default.jpg";
    }

    async function renderInstagram() {
      const raw = sessionStorage.getItem('instagram-data');
      if (!raw) {
        showWarning('Nenhum dado encontrado. Volte para a página de upload e envie os arquivos.');
        return;
      }

      let parsed;
      try {
        parsed = JSON.parse(raw);
      } catch (err) {
        console.error(err);
        showWarning('Erro ao ler os dados salvos. Volte para a página de upload.');
        return;
      }

      const standings = Array.isArray(parsed.standings) ? parsed.standings : [];
      const metadata = parsed.metadata || {};
      if (standings.length === 0) {
        showWarning('Nenhuma linha válida encontrada. Volte para o upload e tente novamente.');
        return;
      }

      const margemTopo = 160;
      const larguraPodio = 400;
      const larguraLista = 500;
      const gapEntreBlocos = 40;
      const startX = (canvas.width - (larguraPodio + gapEntreBlocos + larguraLista)) / 2;
      const alturaItemPodio = 400;
      const espacamento = 30;
      const coresBorda = ['#D4AF37', '#C0C0C0', '#CD7F32'];

      const bg = await carregarImagem('img/bg.jpg');
      if (bg) {
        ctx.drawImage(bg, 0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = '#111111';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillRect(0, 0, canvas.width, 140);
      const logo = await carregarImagem('img/logo.png');
      if (logo) ctx.drawImage(logo, 20, 10, 300, 120);

      if (metadata.enabled) {
        ctx.fillStyle = '#ffffff';
        ctx.font = '24px sans-serif';
        ctx.textAlign = 'right';
        const data = formatarData(metadata.date);
        const loja = metadata.store || '';
        const formato = metadata.format || '';
        ctx.fillText(`${data} | ${loja} | ${formato}`, canvas.width - 40, 65);
      }

      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillRect(0, canvas.height - 120, canvas.width, 120);
      const logoDominate = await carregarImagem('img/13Dominate_Logo.svg');
      if (logoDominate) {
        const maxW = 220;
        const maxH = 80;
        const ratio = Math.min(maxW / logoDominate.width, maxH / logoDominate.height);
        const newW = logoDominate.width * ratio;
        const newH = logoDominate.height * ratio;
        const x = canvas.width - newW - 30;
        const y = (canvas.height - 120) + (120 - newH) / 2;
        ctx.drawImage(logoDominate, x, y, newW, newH);
      }

      const podio = standings.slice(0, 3);
      for (let i = 0; i < podio.length; i++) {
        const y = margemTopo + (i * (alturaItemPodio + espacamento));
        const imagem = await carregarImagem(obterCaminhoImagemDoJson(podio[i].heroi));
        if (imagem) drawImageCover(ctx, imagem, startX, y, larguraPodio, alturaItemPodio);

        ctx.strokeStyle = coresBorda[i];
        ctx.lineWidth = 6;
        ctx.strokeRect(startX, y, larguraPodio, alturaItemPodio);

        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(startX, y + alturaItemPodio - 100, larguraPodio, 100);

        const nomeFormatado = podio[i].nome.trim().split(' ').slice(0, 2).join(' ').toUpperCase();
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'left';
        ctx.font = 'bold 32px sans-serif';
        ctx.fillText(nomeFormatado, startX + 20, y + alturaItemPodio - 60);

        ctx.font = '20px sans-serif';
        ctx.fillStyle = '#cccccc';
        const heroiLimpo = podio[i].heroi.replace(/\s*\(ll\)\s*$/i, '').trim();
        ctx.fillText(heroiLimpo.toUpperCase(), startX + 20, y + alturaItemPodio - 30);

        ctx.font = 'bold 80px sans-serif';
        ctx.textAlign = 'left';
        ctx.shadowColor = 'rgba(0, 0, 0, 1)';
        ctx.shadowBlur = 8;
        ctx.fillStyle = coresBorda[i];
        ctx.fillText(`${i + 1}º`, startX + 20, y + 90);
        ctx.shadowBlur = 0;
      }

      const lista = standings.slice(3);
      let listaY = margemTopo;
      let listaX = startX + larguraPodio + gapEntreBlocos;

      for (let p of lista) {
        if (listaY + 50 > (canvas.height - 120)) break;

        const isDropped = p.isDropped === true || /^dropped$/i.test(String(p.rank || ''));
        const rankDisplay = isDropped ? '-' : p.rank;

        ctx.fillStyle = isDropped ? '#2f343f' : '#4a0a0d';
        ctx.strokeStyle = isDropped ? '#6b7280' : '#c5a059';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.roundRect(listaX, listaY, larguraLista, 50, 5);
        ctx.fill();
        ctx.stroke();

        const circuloX = listaX + 35;
        const circuloY = listaY + 25;
        const raio = 18;
        ctx.beginPath();
        ctx.arc(circuloX, circuloY, raio, 0, 2 * Math.PI);
        ctx.fillStyle = isDropped ? '#555555' : '#c5a059';
        ctx.fill();

        ctx.fillStyle = isDropped ? '#ffffff' : '#000000';
        ctx.font = 'bold 20px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(rankDisplay, circuloX, circuloY);

        let nomeExibido = p.nome.trim().split(' ');
        if (nomeExibido.length > 1) nomeExibido = `${nomeExibido[0]} ${nomeExibido[nomeExibido.length - 1]}`;
        else nomeExibido = p.nome;
        nomeExibido = nomeExibido.toUpperCase();
        if (nomeExibido.length > 18) nomeExibido = nomeExibido.substring(0, 16) + '...';

        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic';
        ctx.font = 'bold 20px sans-serif';

        if (isDropped) {
          ctx.fillStyle = '#aaaaaa';
          ctx.fillText(nomeExibido, listaX + 70, listaY + 33);
        } else {
          ctx.fillStyle = '#ffffff';
          ctx.fillText(nomeExibido, listaX + 70, listaY + 33);
          ctx.textAlign = 'right';
          ctx.fillStyle = '#c5a059';
          ctx.font = 'bold 18px sans-serif';
          ctx.fillText(`${p.vitorias} VITÓRIA(S)`, listaX + larguraLista - 15, listaY + 33);
        }

        listaY += 60;
      }
    }

    function voltarTela() {
      window.location.href = 'instagram.html';
    }

    function baixarImagem() {
      const link = document.createElement('a');
      link.download = 'instagram-display.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    renderInstagram();
  </script>
</body>
</html>
