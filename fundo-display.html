<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAB Stream Overlay - Display</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Roboto", sans-serif; }
  html, body { min-height: 100%; }
  body {
    background: #000;
    color: white;
    overflow: hidden;
  }

  #overlay { display: block; position: relative; min-height: 100vh; }

  .scoreboard {
    position: absolute; top: 0; width: 100%; height: 80px; background: rgba(0,0,0,0.9);
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 140px; font-size: 26px; font-weight: bold; color: white;
    border-bottom: 2px solid rgba(255,255,255,0.1); text-shadow: 0 0 6px black;
    z-index: 10;
  }

  .player { display: flex; align-items: center; gap: 20px; }
  .player-head { display: flex; flex-direction: column; line-height: 1.1; }
  .player-head.left { align-items: flex-start; }
  .player-head.right { align-items: flex-end; }
  .hero-subtitle { font-size: 14px; opacity: 0.75; margin-top: 4px; }
  .score { font-size: 30px; }

  .life-box {
    position: relative; width: 90px; height: 90px; cursor: pointer;
  }

  .life-box img {
    width: 100%; height: 100%; object-fit: contain; opacity: 0.85;
  }

  .life-value {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -48%);
    font-size: 36px; font-weight: bold; color: white;
    text-shadow: 2px 2px 8px black; white-space: nowrap; pointer-events: none;
  }

  .life-left,
  .life-right {
    position: absolute; top: 0; width: 50%; height: 100%;
  }

  .life-left { left: 0; }
  .life-right { right: 0; }

  .life-left:hover,
  .life-right:hover { background: rgba(255,255,255,0.08); }

  .camera {
    position: absolute; top: 10px; width: 120px; height: 120px;
    background-color: rgba(0,0,0,0.35); border: 2px solid rgba(255,255,255,0.12);
    border-radius: 18px; backdrop-filter: blur(6px); z-index: 20;
    background-size: cover; background-position: center; background-repeat: no-repeat;
    background-image: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.2));
    box-shadow: 0 12px 30px rgba(0,0,0,0.35);
  }

  .camera.left { left: 12px; }
  .camera.right { right: 12px; }

  .play-area {
    position: absolute; top: 90px; bottom: 0; left: 0; right: 0;
    display: flex; justify-content: center; align-items: center; z-index: 5;
  }

  .play-space {
    width: 65%; height: 80%; background: rgba(0,0,0,0.25);
    border: 2px solid rgba(255,255,255,0.15); border-radius: 15px;
    backdrop-filter: blur(4px);
  }

  .fade-group {
    transition: opacity 0.36s ease, transform 0.24s ease;
    opacity: 1; transform: translateY(0);
  }

  .fade-hidden {
    opacity: 0; transform: translateY(-6px); pointer-events: none;
  }

  .invisible { visibility: hidden; }

  @media (max-width: 1120px) {
    .scoreboard { padding: 0 30px; font-size: 20px; }
    .player { gap: 12px; }
    .life-box { width: 70px; height: 70px; }
    .score { font-size: 24px; }
    .camera { width: 220px; height: 260px; }
    .hero { width: 280px; }
    .play-space { width: 90%; height: 72%; }
  }
</style>
</head>
<body>
  <div id="overlay">
    <div class="scoreboard">
      <div class="player">
        <div class="player-head left">
          <span id="p1-display-name">Player 1</span>
          <span class="hero-subtitle" id="p1-hero-label">Herói não selecionado</span>
        </div>
        <span id="placar-left" class="fade-group"><span class="score" id="p1-score">0-0-0</span></span>
        <div class="life-box fade-group" id="p1-life-box">
          <img src="assets/life.png" alt="Vida">
          <div class="life-value" id="p1-life">40</div>
          <div class="life-left"></div>
          <div class="life-right"></div>
        </div>
      </div>
      <div class="player">
        <div class="life-box fade-group" id="p2-life-box">
          <img src="assets/life.png" alt="Vida">
          <div class="life-value" id="p2-life">40</div>
          <div class="life-left"></div>
          <div class="life-right"></div>
        </div>
        <span id="placar-right" class="fade-group"><span class="score" id="p2-score">0-0-0</span></span>
        <div class="player-head right">
          <span id="p2-display-name">Player 2</span>
          <span class="hero-subtitle" id="p2-hero-label">Herói não selecionado</span>
        </div>
      </div>
    </div>
    <div class="camera left fade-group" id="cam-left"></div>
    <div class="camera right fade-group" id="cam-right"></div>
    <div class="play-area"><div class="play-space"></div></div>
  </div>
  <script src="herois.js"></script>
  <script src="fundo-display.js"></script>
</body>
</html>
