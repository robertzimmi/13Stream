<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantidade Herói - Display</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { background: var(--bg); color: var(--text); }
    .page-screen { min-height: 100vh; padding: 2rem; }
    .display-card { width: min(1200px, 100%); margin: 0 auto; display: grid; gap: 1.5rem; }
    .panel { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: var(--radius); padding: 1.5rem; }
    .panel h1, .panel h2 { margin-bottom: 0.75rem; }
    .panel h1 { font-size: clamp(2rem, 4vw, 2.75rem); }
    .hero-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 1rem; margin-top: 1rem; }
    .hero-card { position: relative; aspect-ratio: 1 / 1; border-radius: 20px; overflow: hidden; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18); }
    .hero-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .hero-badge { position: absolute; top: 0.8rem; right: 0.8rem; min-width: 2.4rem; min-height: 2.4rem; padding: 0.25rem 0.5rem; border-radius: 999px; background: rgba(0, 0, 0, 0.7); color: #fff; font-size: 0.95rem; font-weight: 800; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(6px); }
    .back-link { display: inline-flex; gap: 0.5rem; align-items: center; margin-top: 1rem; color: var(--text); text-decoration: none; }
    .warning { margin-bottom: 1rem; padding: 1rem 1.1rem; border-radius: 14px; background: rgba(255, 90, 90, 0.08); border: 1px solid rgba(255, 90, 90, 0.2); color: #ffd4d4; }
  </style>
</head>
<body class="page-screen page-screen--live">
  <main class="display-card">
    <section class="panel">
      <div id="heroGrid" class="hero-grid"></div>
    </section>

  </main>

  <script src="herois.js"></script>
  <script>
    const data = sessionStorage.getItem('qtdheroes-data');
    const warning = document.getElementById('warning');
    const heroGrid = document.getElementById('heroGrid');

    function normalizeText(value) {
      return value
        .toString()
        .normalize('NFD')
        .replace(/\p{Diacritic}/gu, '')
        .replace(/\s+/g, ' ')
        .replace(/[^\w\s]/g, '')
        .trim()
        .toLowerCase();
    }

    function findHeroImage(heroName) {
      const fallback = 'assets/heroes/default.jpg';
      if (!heroName) return fallback;
      const normalized = normalizeText(heroName);
      const exact = bancoDeImagensHerois.find(item => normalizeText(item.nome) === normalized);
      const matched = exact || bancoDeImagensHerois.find(item => normalizeText(item.nome).includes(normalized) || normalized.includes(normalizeText(item.nome)));
      if (!matched) return fallback;
      const imagePath = matched.arquivo || '';
      return imagePath.startsWith('assets/') ? imagePath : `assets/${imagePath}`;
    }

    function createHeroCard(heroName, count) {
      const card = document.createElement('div');
      card.className = 'hero-card';
      const imageSrc = findHeroImage(heroName);
      card.innerHTML = `
        <img src="${imageSrc}" alt="${heroName}">
        <div class="hero-badge">${count}</div>
        <div class="hero-label">${heroName}</div>
      `;
      return card;
    }

    if (!data) {
      warning.textContent = 'Nenhum dado encontrado. Volte para a página de upload e envie o CSV novamente.';
      warning.style.display = 'block';
    } else {
      try {
        const parsed = JSON.parse(data);
        const heroCounts = parsed.counts || {};

        const heroesSorted = Object.entries(heroCounts)
          .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'pt-BR', { sensitivity: 'base' }));

        heroesSorted.forEach(([hero, count]) => {
          heroGrid.appendChild(createHeroCard(hero, count));
        });
      } catch (err) {
        console.error(err);
        warning.textContent = 'Erro ao ler os dados salvos. Volte para a página de upload e tente novamente.';
        warning.style.display = 'block';
      }
    }
  </script>
</body>
</html>
