<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top 8</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { background: var(--bg); color: var(--text); }
    .page-screen { min-height: 100vh; padding: 2rem; display: grid; place-items: center; }
    .panel { width: min(620px, 100%); background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: var(--radius); padding: 1.5rem; box-shadow: 0 18px 50px rgba(0,0,0,0.25); }
    .panel h1 { margin-bottom: 0.75rem; font-size: clamp(1.8rem, 4vw, 2.5rem); }
    .top8-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 0.5rem; }
    .top8-item { display: grid; grid-template-columns: auto 1fr; gap: 0.75rem; align-items: center; padding: 0.75rem 1rem; border-radius: 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.10); }
    .position { width: 2.4rem; height: 2.4rem; display: grid; place-items: center; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 800; font-size: 0.95rem; }
    .item-content { display: grid; gap: 0.15rem; }
    .item-name { font-size: 0.98rem; font-weight: 700; }
    .warning { margin-bottom: 1rem; padding: 0.9rem 1rem; border-radius: 14px; background: rgba(255, 90, 90, 0.08); border: 1px solid rgba(255, 90, 90, 0.2); color: #ffd4d4; }
  </style>
</head>
<body class="page-screen page-screen--live">
  <main class="panel">
    <h1>Top 8</h1>
    <div id="warning" class="warning" style="display:none;"></div>
    <ul id="top8List" class="top8-list"></ul>
  </main>

  <script>
    const data = sessionStorage.getItem('top8-data');
    const warning = document.getElementById('warning');
    const top8List = document.getElementById('top8List');

    if (!data) {
      warning.textContent = 'Nenhum dado encontrado. Volte para a página de upload e envie o CSV novamente.';
      warning.style.display = 'block';
    } else {
      try {
        const rows = JSON.parse(data);
        if (!Array.isArray(rows) || rows.length === 0) {
          warning.textContent = 'O arquivo enviado não contém linhas válidas.';
          warning.style.display = 'block';
        } else {
          rows.slice(0, 8).forEach(row => {
            const li = document.createElement('li');
            li.className = 'top8-item';
            li.innerHTML = `
              <div class="position">${row.rank || '-'}</div>
              <div class="item-content">
                <div class="item-name">${row.name || 'Sem nome'}</div>
              </div>
            `;
            top8List.appendChild(li);
          });
        }
      } catch (err) {
        console.error(err);
        warning.textContent = 'Erro ao ler os dados salvos. Volte para a página de upload e tente novamente.';
        warning.style.display = 'block';
      }
    }
  </script>
</body>
</html>
