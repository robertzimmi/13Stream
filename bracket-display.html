<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bracket Top 8</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    :root {
      --gold: #c9a34e;
      --text: #dfeee6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .bracket-wrapper {
      width: min(1000px, 100%);
      text-align: center;
      padding: 1rem;
    }

    h1 {
      color: var(--gold);
      margin-bottom: 18px;
      font-size: 18px;
    }

    .bracket {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: repeat(7, 72px);
      gap: 0 60px;
      align-items: center;
      justify-content: center;
    }

    .match {
      width: 240px;
      margin: 0 auto;
      background: rgba(128,128,128,0.8);
      border: 2px solid var(--gold);
      border-radius: 8px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .player {
      background: rgba(255,255,255,0.06);
      border-radius: 6px;
      padding: 8px 10px;
      margin: 6px 0;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: flex-start;
      min-height: 38px;
    }

    .player.no-img img { display: none; }
    .player:hover { background: var(--gold); color: #000; }
    .winner { background: var(--gold); color: #000; }
    .player img {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      display: inline-block;
    }

    .q1 { grid-column: 1; grid-row: 1; }
    .q2 { grid-column: 1; grid-row: 3; }
    .q3 { grid-column: 1; grid-row: 5; }
    .q4 { grid-column: 1; grid-row: 7; }
    .s1 { grid-column: 2; grid-row: 2; }
    .s2 { grid-column: 2; grid-row: 6; }
    .f1 { grid-column: 3; grid-row: 4; }

    @media (max-width: 900px) {
      body { align-items: flex-start; padding: 20px; height: auto; overflow: auto; }
      .bracket { grid-template-columns: 1fr; grid-template-rows: none; gap: 12px; }
      .q1, .q2, .q3, .q4, .s1, .s2, .f1 { grid-column: auto; grid-row: auto; }
      .match { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="bracket-wrapper">
    <div class="bracket" id="bracket">
      <div class="match q1" id="q1"></div>
      <div class="match q2" id="q2"></div>
      <div class="match q3" id="q3"></div>
      <div class="match q4" id="q4"></div>
      <div class="match s1" id="s1"></div>
      <div class="match s2" id="s2"></div>
      <div class="match f1" id="f1"></div>
    </div>
  </div>

  <script>
    function escapeHtml(str) { return str ? String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') : ''; }

    function buildPlayerElement(p) {
      const imgTag = p.img ? `<img src="${p.img}" alt="">` : '';
      const noImgClass = !p.img ? 'no-img' : '';
      return `<div class="player ${noImgClass}">${imgTag}<span>${escapeHtml(p.player)}</span></div>`;
    }

    function populateBracket(players) {
      const qMatches = [
        [players[0] || { player:'—', img:'' }, players[7] || { player:'—', img:'' }],
        [players[3] || { player:'—', img:'' }, players[4] || { player:'—', img:'' }],
        [players[2] || { player:'—', img:'' }, players[5] || { player:'—', img:'' }],
        [players[1] || { player:'—', img:'' }, players[6] || { player:'—', img:'' }]
      ];

      document.getElementById('q1').innerHTML = qMatches[0].map(buildPlayerElement).join('');
      document.getElementById('q2').innerHTML = qMatches[1].map(buildPlayerElement).join('');
      document.getElementById('q3').innerHTML = qMatches[2].map(buildPlayerElement).join('');
      document.getElementById('q4').innerHTML = qMatches[3].map(buildPlayerElement).join('');
      document.getElementById('s1').innerHTML = buildPlayerElement({ player:'—', img:'' }) + buildPlayerElement({ player:'—', img:'' });
      document.getElementById('s2').innerHTML = buildPlayerElement({ player:'—', img:'' }) + buildPlayerElement({ player:'—', img:'' });
      document.getElementById('f1').innerHTML = buildPlayerElement({ player:'—', img:'' }) + buildPlayerElement({ player:'—', img:'' });
    }

    const data = sessionStorage.getItem('bracket-data');
    if (!data) {
      document.getElementById('bracket').innerHTML = '<div class="match" style="grid-column:1/-1;">Nenhum dado encontrado. Volte para a página anterior e envie o CSV.</div>';
    } else {
      try {
        const rows = JSON.parse(data);
        const players = rows.slice(0, 8).map(row => ({ player: row.name || '—', img: '' }));
        populateBracket(players);
      } catch (err) {
        console.error(err);
        document.getElementById('bracket').innerHTML = '<div class="match" style="grid-column:1/-1;">Erro ao ler os dados salvos.</div>';
      }
    }

    document.getElementById('bracket').addEventListener('click', ev => {
      const el = ev.target.closest('.player');
      if (!el) return;
      const playerName = el.querySelector('span')?.textContent?.trim();
      if (!playerName || playerName === '—') return;

      const parentMatch = el.closest('.match');
      if (!parentMatch) return;

      parentMatch.querySelectorAll('.player').forEach(p => p.classList.remove('winner'));
      el.classList.add('winner');

      const moveWinner = (targetId, index) => {
        const targetMatch = document.getElementById(targetId);
        if (!targetMatch) return;
        const targetPlayers = Array.from(targetMatch.querySelectorAll('.player'));
        const targetPlayer = targetPlayers[index];
        if (!targetPlayer) return;

        const sourceImg = el.querySelector('img');
        const imgSrc = sourceImg ? sourceImg.src : '';
        const targetImg = targetPlayer.querySelector('img');

        targetPlayer.querySelector('span').textContent = playerName;
        if (targetImg) {
          targetImg.src = imgSrc;
          if (!imgSrc) targetPlayer.classList.add('no-img');
          else targetPlayer.classList.remove('no-img');
        }
        targetPlayer.classList.remove('winner');
      };

      const parentId = parentMatch.id;
      if (parentId.startsWith('q')) {
        const map = { q1: ['s1', 0], q2: ['s1', 1], q3: ['s2', 0], q4: ['s2', 1] };
        const target = map[parentId];
        if (target) moveWinner(target[0], target[1]);
      } else if (parentId.startsWith('s')) {
        const map = { s1: 0, s2: 1 };
        const targetIndex = map[parentId];
        moveWinner('f1', targetIndex);
      }
    });
  </script>
</body>
</html>
