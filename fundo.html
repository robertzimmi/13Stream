<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuração — Fundo para transmissão</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page-config">
  <a class="back-link" href="index.html">← Menu</a>

  <main class="config">
    <header class="config__header">
      <h1 class="config__title">Configurar transmissão</h1>
      <div class="config__header-controls">
        <div class="toggle">
          <input type="checkbox" id="show-cameras" name="show-cameras">
          <label for="show-cameras">Mostrar herói</label>
        </div>
        <div class="toggle">
          <input type="checkbox" id="show-life" name="show-life">
          <label for="show-life">Mostrar vida</label>
        </div>
        <div class="toggle">
          <input type="checkbox" id="show-score" name="show-score">
          <label for="show-score">Mostrar placar</label>
        </div>
        <div class="control-group">
          <label for="stream-format">Formato:</label>
          <select id="stream-format" name="stream-format">
            <option value="cc">CC (Adult)</option>
            <option value="sage">Sage (Young)</option>
          </select>
        </div>
      </div>
    </header>

    <form class="config__form" id="fundo-form">
      <div class="config__players">
        <!-- PLAYER 1 CONFIG -->
        <div class="player-config" id="p1-config">
          <h2>Player 1</h2>
          <label for="p1-name">Nome:</label>
          <input type="text" id="p1-name" name="p1-name">

          <div class="toggle record-toggle">
            <input type="checkbox" id="p1-show-record" name="p1-show-record">
            <label for="p1-show-record">Exibir Wins / Losses / Draws</label>
          </div>

          <div class="record-fields" id="p1-record-fields">
            <label for="p1-wins">Wins:</label>
            <input type="number" id="p1-wins" name="p1-wins" min="0" disabled>

            <label for="p1-losses">Losses:</label>
            <input type="number" id="p1-losses" name="p1-losses" min="0" disabled>

            <label for="p1-draws">Draws:</label>
            <input type="number" id="p1-draws" name="p1-draws" min="0" disabled>
          </div>

          <label for="p1-hero">Herói:</label>
          <select id="p1-hero" name="p1-hero"></select>

          <div class="preview">
            <img id="p1-preview" src="" alt="Preview Player 1" hidden>
          </div>

          <div class="toggle">
            <input type="checkbox" id="p1-flip" name="p1-flip">
            <label for="p1-flip">Inverter imagem</label>
          </div>
        </div>

        <!-- PLAYER 2 CONFIG -->
        <div class="player-config" id="p2-config">
          <h2>Player 2</h2>
          <label for="p2-name">Nome:</label>
          <input type="text" id="p2-name" name="p2-name">

          <div class="toggle record-toggle">
            <input type="checkbox" id="p2-show-record" name="p2-show-record">
            <label for="p2-show-record">Exibir Wins / Losses / Draws</label>
          </div>

          <div class="record-fields" id="p2-record-fields">
            <label for="p2-wins">Wins:</label>
            <input type="number" id="p2-wins" name="p2-wins" min="0" disabled>

            <label for="p2-losses">Losses:</label>
            <input type="number" id="p2-losses" name="p2-losses" min="0" disabled>

            <label for="p2-draws">Draws:</label>
            <input type="number" id="p2-draws" name="p2-draws" min="0" disabled>
          </div>

          <label for="p2-hero">Herói:</label>
          <select id="p2-hero" name="p2-hero"></select>

          <div class="preview">
            <img id="p2-preview" src="" alt="Preview Player 2" hidden>
          </div>

          <div class="toggle">
            <input type="checkbox" id="p2-flip" name="p2-flip">
            <label for="p2-flip">Inverter imagem</label>
          </div>
        </div>
      </div>

      <button class="config__submit" type="submit">Enviar</button>
    </form>
  </main>

  <script src="herois.js"></script>
  <script src="fundo-config.js"></script>
</body>
</html>
